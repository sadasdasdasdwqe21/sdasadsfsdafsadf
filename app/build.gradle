plugins {
    id 'com.android.application'
}

android {
    namespace 'app.shakefinder'
    compileSdk 34

    defaultConfig {
        applicationId 'app.shakefinder'
        minSdk 24
        targetSdk 34
        versionCode 2
        versionName '1.1'
    }

    // One fixed key, so each new build installs over the previous one.
    signingConfigs {
        debug {
            storeFile file('shakefinder.keystore')
            storePassword 'shakefinder'
            keyAlias 'shakefinder'
            keyPassword 'shakefinder'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
