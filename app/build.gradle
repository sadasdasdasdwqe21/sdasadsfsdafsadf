plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
    id 'com.google.devtools.ksp'
}

android {
    namespace 'app.livelingo'
    compileSdk 34

    defaultConfig {
        applicationId 'app.livelingo'
        // Android 10: the first version with AudioPlaybackCapture.
        minSdk 29
        targetSdk 34
        versionCode 1
        versionName '0.1.0'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }

    signingConfigs {
        // One fixed key, so each new debug build installs over the previous one.
        debug {
            storeFile file('livelingo.keystore')
            storePassword 'livelingo'
            keyAlias 'livelingo'
            keyPassword 'livelingo'
        }
        // Release signing only happens when the key is supplied through CI secrets.
        release {
            def ks = System.getenv('LIVELINGO_RELEASE_KEYSTORE')
            if (ks != null && new File(ks).exists()) {
                storeFile file(ks)
                storePassword System.getenv('LIVELINGO_RELEASE_STORE_PASSWORD')
                keyAlias System.getenv('LIVELINGO_RELEASE_KEY_ALIAS')
                keyPassword System.getenv('LIVELINGO_RELEASE_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            def ks = System.getenv('LIVELINGO_RELEASE_KEYSTORE')
            if (ks != null && new File(ks).exists()) {
                signingConfig signingConfigs.release
            }
        }
    }

    buildFeatures {
        compose true
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    packaging {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
        }
    }

    testOptions {
        unitTests.returnDefaultValues = true
    }
}

dependencies {
    // Core
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.activity:activity-compose:1.9.3'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.7'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.8.7'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.8.7'
    implementation 'androidx.navigation:navigation-compose:2.8.4'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'

    // Compose + Material 3
    implementation platform('androidx.compose:compose-bom:2024.10.01')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-extended'
    debugImplementation 'androidx.compose.ui:ui-tooling'

    // Settings, history
    implementation 'androidx.datastore:datastore-preferences:1.1.1'
    implementation 'androidx.room:room-runtime:2.6.1'
    implementation 'androidx.room:room-ktx:2.6.1'
    ksp 'androidx.room:room-compiler:2.6.1'

    // Streaming network (WebSocket)
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'

    // On-device translation (optional engine)
    implementation 'com.google.mlkit:translate:17.0.3'

    // Unit tests
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.jetbrains.kotlinx:kotlinx-coroutines-test:1.8.1'
    testImplementation 'org.json:json:20240303'

    // UI tests (compiled in CI, run on a device or emulator)
    androidTestImplementation platform('androidx.compose:compose-bom:2024.10.01')
    androidTestImplementation 'androidx.compose.ui:ui-test-junit4'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    debugImplementation 'androidx.compose.ui:ui-test-manifest'
}
