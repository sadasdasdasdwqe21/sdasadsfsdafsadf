plugins {
    id 'com.android.application'
}

android {
    namespace 'app.sitestamp'
    compileSdk 34

    defaultConfig {
        applicationId 'app.sitestamp'
        minSdk 29
        targetSdk 34
        versionCode 2
        versionName '1.1'
    }

    // One fixed key, so each new build installs over the previous one.
    signingConfigs {
        debug {
            storeFile file('sitestamp.keystore')
            storePassword 'sitestamp'
            keyAlias 'sitestamp'
            keyPassword 'sitestamp'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    def camerax = '1.4.2'
    implementation "androidx.camera:camera-core:$camerax"
    implementation "androidx.camera:camera-camera2:$camerax"
    implementation "androidx.camera:camera-lifecycle:$camerax"
    implementation "androidx.camera:camera-video:$camerax"
    implementation "androidx.camera:camera-view:$camerax"
    implementation "androidx.camera:camera-effects:$camerax"
    implementation 'androidx.activity:activity:1.9.3'
    implementation 'androidx.exifinterface:exifinterface:1.3.7'
    // Keeps every Kotlin runtime piece the libraries pull in on one version.
    implementation platform('org.jetbrains.kotlin:kotlin-bom:1.9.24')
}
